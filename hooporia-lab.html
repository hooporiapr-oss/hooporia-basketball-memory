<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (sessionStorage.getItem('hoop-gate-pass') !== '1') {
  window.location.replace('index.html');
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Hooporia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* Fixed to the viewport rather than height:100vh — 100vh recalculates
   whenever a mobile/VR browser's UI chrome shows or hides, and reacting
   to that recalculation is what causes a page to drift on its own.
   Fixed positioning removes the dependency entirely. */
html,body{
  height:100%;
  overflow:hidden;
  background:#000;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

/* True black, not a dark gradient — this page is meant to sit
   perfectly solid whether viewed on desktop or inside a VR headset,
   rather than fighting a visible background panel in either context. */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#000;
}

#panel{
  position:relative;
  z-index:2;
  width:100%;
  max-width:820px;
  max-height:100%;
  overflow-y:auto;
  text-align:center;
}
.bigTitle{
  font-size:clamp(2.4rem,7vw,4.2rem);
  font-weight:900;
  letter-spacing:.02em;
  line-height:1.05;
  margin:40px 0 44px;
  text-shadow:0 0 50px rgba(243,116,24,.5);
}
.bigTitle span{color:#f37418}
.enter-btn{
  display:block;
  width:100%;
  max-width:440px;
  margin:6px auto 24px;
  padding:20px 24px;
  border:none;
  border-radius:20px;
  background:linear-gradient(135deg,#f37418,#ff9b50);
  color:#1a0900;
  font-size:1.1rem;
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  text-decoration:none;
  box-shadow:0 0 55px rgba(243,116,24,.8);
}
.enter-btn:active{transform:scale(.98)}

footer{
  margin-top:24px;
  font-size:.72rem;
  color:#6b5d52;
  letter-spacing:.02em;
}

#soundToggle{
  position:fixed;top:14px;right:14px;z-index:30;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
</style>
</head>
<body>
<button id="soundToggle" aria-label="Toggle sound" title="Toggle beat sound">🔊</button>

<div id="stage">
  <div id="panel">
    <div class="bigTitle">Basketball <span>Hooporia</span></div>
    <a class="enter-btn" href="hooporia-lab-02.html">▶ Click Here To Tip-Off Memory Basketball</a>

    <footer>Gostar Digital LLC</footer>
  </div>
</div>
<script>
(function(){
var soundBtn=document.getElementById('soundToggle');
var muted=false;

soundBtn.addEventListener('click',function(e){
  e.stopPropagation();
  muted=!muted;
  soundBtn.textContent=muted?'🔇':'🔊';
  soundBtn.style.opacity=muted?'.55':'1';
});
})();
</script>
</body>
</html>
