<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (sessionStorage.getItem('hoop-gate-pass') !== '1') {
  window.location.replace('index.html');
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Hooporia · Training Modes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* Fixed to the viewport rather than height:100vh — 100vh recalculates
   whenever a mobile/VR browser's UI chrome shows or hides, and reacting
   to that recalculation is what causes a page to drift on its own.
   Fixed positioning removes the dependency entirely. */
html,body{
  height:100%;
  overflow:hidden;
  background:#000;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

/* True black, not a dark gradient — same solid background as every
   other page in this flow, on desktop or in a VR headset. */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#000;
}

#panel{
  position:relative;
  z-index:2;
  width:100%;
  max-width:820px;
  max-height:100%;
  overflow-y:auto;
  text-align:center;
}

.back-btn{
  display:inline-block;
  padding:10px 20px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.5);
  color:#fff;
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-decoration:none;
  margin-bottom:20px;
}
.back-btn:active{transform:scale(.98)}

.subtitle{
  font-size:1.25rem;
  font-weight:700;
  color:#c9b8a8;
  margin-bottom:24px;
  letter-spacing:.03em;
}

.arena-title{
  font-size:1.6rem;
  font-weight:900;
  font-style:italic;
  letter-spacing:.03em;
  text-transform:uppercase;
  margin:28px 0 2px;
  text-shadow:0 0 30px rgba(243,116,24,.4);
}
.arena-title span{color:#f37418}
.arena-sub{
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#7c3aed;
  margin-bottom:18px;
}
.fullgame-btn{
  display:block;
  width:100%;
  max-width:440px;
  margin:0 auto 26px;
  padding:16px 20px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;
  font-size:.95rem;
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 0 40px rgba(124,58,237,.6);
}
.fullgame-btn:active{transform:scale(.98)}

footer{
  margin-top:24px;
  font-size:.72rem;
  color:#6b5d52;
  letter-spacing:.02em;
}

#soundToggle{
  position:fixed;top:14px;right:14px;z-index:30;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
</style>
</head>
<body>
<button id="soundToggle" aria-label="Toggle sound" title="Toggle beat sound">🔊</button>

<div id="stage">
  <div id="panel">
    <a class="back-btn" href="hooporia-lab.html">← Back</a>

    <div class="arena-title">MEMORY <span>BASKETBALL</span></div>
    <div class="arena-sub">4 Quarters of Memory Action</div>
    <button class="fullgame-btn" id="fullGameBtn">🏀 PLAY THE FULL GAME — ALL 4 QUARTERS</button>

    <footer>Gostar Digital LLC</footer>
  </div>
</div>
<script>
(function(){
var soundBtn=document.getElementById('soundToggle');
var muted=false;

soundBtn.addEventListener('click',function(e){
  e.stopPropagation();
  muted=!muted;
  soundBtn.textContent=muted?'🔇':'🔊';
  soundBtn.style.opacity=muted?'.55':'1';
});

// Starts a real, tracked four-quarter run — a fresh scoreboard, and a
// flag each quarter game checks for on its own end screen. Standalone
// play (clicking straight into any single quarter from this page)
// never sets this, so nothing changes for solo practice.
document.getElementById('fullGameBtn').addEventListener('click',function(){
  sessionStorage.setItem('hoop-fullgame-active','1');
  sessionStorage.setItem('hoop-quarter-scores',JSON.stringify({q1:0,q2:0,q3:0,q4:0}));
  window.location.href='basketball-recall.html';
});
})();
</script>
</body>
</html>
